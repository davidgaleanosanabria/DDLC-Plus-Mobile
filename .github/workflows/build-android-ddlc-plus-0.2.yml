name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Clonar repo
        uses: actions/checkout@v5

      - name: Compilar APK
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/game" \
            -v "$RUNNER_TEMP/build:/build" \
            dinaki/renpy:android \
            sh renpy.sh launcher android_build /game --destination /build
          ls -laR "$RUNNER_TEMP/build"

      - name: Recoger APK
        run: |
          mkdir -p apk-out
          find "$RUNNER_TEMP/build" -name "*.apk" -exec cp {} apk-out/ \;
          ls -la apk-out
          if [ -z "$(ls -A apk-out)" ]; then
            echo "No se encontró ningún APK"
            exit 1
          fi

      - name: Subir APK
        uses: actions/upload-artifact@v5
        with:
          name: DDLC-Plus-Mobile-apk
          path: apk-out/
          if-no-files-found: error
